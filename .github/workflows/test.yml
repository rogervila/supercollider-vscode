name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      # Also installs client/ and server/ dependencies (postinstall)
      - run: npm ci

      # VS Code needs a display: xvfb-run provides a virtual one
      - run: xvfb-run -a npm test
